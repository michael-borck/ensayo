<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ensayo — coming soon</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0e14; --accent:#00d4aa; --text:#e7ecf3; --muted:#93a1b6; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(60% 60% at 70% 0%, rgba(74,99,231,0.15), transparent 70%),
                  radial-gradient(50% 50% at 10% 20%, rgba(0,212,170,0.10), transparent 70%), var(--bg);
      color: var(--text); text-align: center; padding: 2rem; }
    .card { max-width: 480px; }
    .brand { font-weight: 800; font-size: 1.6rem; margin-bottom: 1rem; }
    .brand span { color: var(--accent); }
    h1 { font-size: 1.8rem; margin: 0 0 0.8rem; letter-spacing: -0.02em; }
    p { color: var(--muted); line-height: 1.6; font-size: 1.05rem; }
    .pill { display:inline-block; margin-top:1.5rem; padding: 0.3rem 0.8rem; border-radius: 999px;
      border: 1px solid rgba(0,212,170,0.35); background: rgba(0,212,170,0.08);
      color: var(--accent); font-size: 0.82rem; }
    a { color: var(--muted); font-size: 0.82rem; text-decoration: none; opacity: 0.5; }
    a:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Ensayo<span>·</span></div>
    <h1>We're polishing something special.</h1>
    <p>Ensayo turns worksheets into living workplace simulations. We're adding the final touches — check back shortly.</p>
    <span class="pill">● Coming soon</span>
    <div style="margin-top:2.5rem">
      <a href="/admin/">Admin sign-in →</a>
    </div>
  </div>
</body>
</html>
