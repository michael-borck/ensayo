[project]
name = "ensayo"
version = "0.1.0"
description = "Configuration-driven generator for LLM-assisted workplace teaching simulations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michael Borck" }]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.2",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# uv installs this group by default on `uv sync` / `uv run`, so `uv run pytest`
# gets the project venv's pytest (a global pytest can't import ensayo).
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ensayo = "ensayo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensayo"]

# Bundle shared client assets, the library, and the dashboard inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/ensayo/shared" = "ensayo/shared"
"src/ensayo/library" = "ensayo/library"
"src/ensayo/api/static" = "ensayo/api/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
