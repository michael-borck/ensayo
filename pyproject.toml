[project]
name = "ensayo"
version = "0.1.0"
description = "Configuration-driven generator for LLM-assisted workplace teaching simulations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michael Borck" }]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ensayo = "ensayo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensayo"]

# Bundle the shared client assets (keyword chatbot, etc.) inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/ensayo/shared" = "ensayo/shared"

[tool.pytest.ini_options]
testpaths = ["tests"]
