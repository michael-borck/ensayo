# Ensayo — full-service container (dashboard + API + generated sites).
#
#   cp instance.env.example instance.env   # then fill in secrets (JWT_SECRET, RESEND_API_KEY, …)
#   docker compose up -d --build
#   docker compose exec ensayo ensayo admin create-uc -e admin@your.edu --admin
#   open http://localhost:8080/admin/

services:
  ensayo:
    build: .
    image: ghcr.io/michael-borck/ensayo:latest
    ports:
      # Override with ENSAYO_HTTP_PORT in instance.env. Default 8080.
      - "${ENSAYO_HTTP_PORT:-8080}:80"
    env_file:
      - instance.env
    environment:
      # Runtime data lives on the persisted volume (overrides instance.env).
      ENSAYO_DB: /var/ensayo/ensayo.db
      WORKING_CLONES_DIR: /var/ensayo/sims
    volumes:
      - ensayo-data:/var/ensayo
    restart: unless-stopped

  # Optional — enable for Tier 3 (LLM chatbots with RAG). Spec §9.
  # anythingllm:
  #   image: mintplexlabs/anythingllm
  #   ports: ["3001:3001"]
  #   volumes:
  #     - anythingllm-data:/app/server/storage

volumes:
  ensayo-data:
  # anythingllm-data:
